[project]
name = "jev-cli"
version = "0.2.0"
description = "Small dependency-free CLI for TypeSafe Jev"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
jev = "jev_cli:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**"]
